server.port=8080

# where the JSP pages are kept
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# MongoDB connection. The database "renttrackdb" is created automatically
# the first time something is saved.
spring.data.mongodb.uri=mongodb://localhost:27017/renttrackdb

# keep the login session id in a cookie only (not in the URL)
server.servlet.session.tracking-modes=cookie

# use our own error.jsp instead of the default Spring error page
server.error.whitelabel.enabled=false
